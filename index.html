<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="pages/index.css" />
    <link rel="stylesheet" href="fonts.css" />
    <title>Perfil Saeyoung Choi</title>
  </head>
  <body>
    <header class="top">
      <div class="top__logo">
        <span class="top__icon"></span>
        <h1>Document</h1>
      </div>
      <div class="top__user">
        <span>@707_king_Lol</span>
        <img src="images/707.png" alt="Avatar" class="top__avatar" />
      </div>
    </header>

    <!-- Navegación (opcional) -->
    <nav class="nav">
      <ul class="nav__list">
        <li><a href="#" class="nav__link active">Perfil</a></li>
        <li><a href="#" class="nav__link">Publicaciones</a></li>
        <li><a href="#" class="nav__link">Amigos</a></li>
      </ul>
    </nav>

    <!-- Contenido principal -->
    <main class="main">
      <section class="user-profile">
        <div class="user-profile__header">
          <img
            src="images/saeyoung.jpg"
            alt="Foto de perfil"
            class="user-profile__avatar"
          />
          <div class="user-profile__info">
            <h2 class="user-profile__name">Saeyoung choi</h2>
            <p class="user-profile__username">@707_king_Lol</p>
            <p class="user-profile__stats">14 publicacións</p>
          </div>
        </div>
        <div class="user-profile__bio">
          <p>Apasionado la tecnología y el LOol. Viviendo un día a la vez.</p>
        </div>
      </section>
    </main>

    <!-- POP‑UP (modal) -->
    <div class="modal" id="popup">
      <div class="modal__content">
        <span class="modal__close" id="closePopup">&times;</span>
        <h2>¡Bienvenido de vuelta!</h2>
        <p>Has iniciado sesión como <strong>@707_king_Lol</strong>.</p>
        <button id="closePopupBtn">Aceptar</button>
      </div>
    </div>

    <script src="scripts/scripts.js"></script>
  </body>
</html>
